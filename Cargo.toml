[package]
name = "docx-extractor"
version = "0.1.0"
edition = "2021"
description = "Extract text and images from DOCX files as JSON"
license = "MIT"
repository = "https://github.com/Maks417/docx-extractor"

[[bin]]
name = "docx-extractor"
path = "src/main.rs"

[dependencies]
zip = "2"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
