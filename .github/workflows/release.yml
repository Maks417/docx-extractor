# IMPORTANT: PyPI Trusted Publishing and npm Trusted Publishing both pin the
# OIDC subject to this exact workflow filename (release.yml). Renaming this
# file requires updating the Trusted Publisher configuration on PyPI
# (https://pypi.org/manage/project/docx-extractor-cli/settings/publishing/)
# and npm (https://www.npmjs.com/package/docx-extractor-mcp/access) FIRST,
# or publishing will silently fail.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: docx-extractor-linux-x86_64

          - os: macos-15-intel  # last GitHub-hosted runner with Intel hardware
            target: x86_64-apple-darwin
            artifact: docx-extractor-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: docx-extractor-macos-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: docx-extractor-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/docx-extractor.exe ${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/docx-extractor ${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-mcp:
    name: Publish docx-extractor-mcp to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to a Trusted-Publishing-aware version
        run: npm install -g npm@latest

      - name: Sync package version to release tag
        working-directory: mcp
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Publishing docx-extractor-mcp@$VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        working-directory: mcp
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: mcp
        run: npm run build

      - name: Publish (OIDC via Trusted Publishing — no token)
        working-directory: mcp
        run: npm publish --access public --provenance

  build-wheels:
    name: Build wheel ${{ matrix.plat-name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - artifact: docx-extractor-linux-x86_64
            binary-name: docx-extractor
            plat-name: manylinux_2_28_x86_64
          - artifact: docx-extractor-macos-x86_64
            binary-name: docx-extractor
            plat-name: macosx_11_0_x86_64
          - artifact: docx-extractor-macos-aarch64
            binary-name: docx-extractor
            plat-name: macosx_11_0_arm64
          - artifact: docx-extractor-windows-x86_64.exe
            binary-name: docx-extractor.exe
            plat-name: win_amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download platform binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts

      - name: Stage binary inside the package
        run: |
          mkdir -p python/src/docx_extractor/bin
          cp "artifacts/${{ matrix.artifact }}" "python/src/docx_extractor/bin/${{ matrix.binary-name }}"
          chmod +x "python/src/docx_extractor/bin/${{ matrix.binary-name }}" || true

      - name: Sync wheel version to release tag
        working-directory: python
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Building docx-extractor wheel @ $VERSION (${{ matrix.plat-name }})"
          # Replace the `version = "..."` line in pyproject.toml in place.
          # `--` so sed -i doesn't eat any future flags.
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          grep -E '^version = ' pyproject.toml
          # Also bump the __version__ string in __init__.py so introspection
          # (`docx_extractor.__version__`) matches the wheel metadata.
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" src/docx_extractor/__init__.py

      - name: Install build tooling
        run: pip install --upgrade setuptools wheel

      - name: Build wheel
        working-directory: python
        # Direct setup.py invocation is the canonical way to produce a
        # platform-tagged wheel with a bundled prebuilt binary. The PEP 517
        # `python -m build` path can also do this via --config-setting, but
        # the option chain is fragile across pip/build versions; bdist_wheel
        # --plat-name is stable and supported.
        #
        # The py3-none-<plat> tag is set by setup.py via the _PlatformWheel
        # override of bdist_wheel.get_tag — `--python-tag` alone is NOT
        # sufficient because BinaryDistribution.has_ext_modules=True forces
        # setuptools to default the ABI tag to the runner's interpreter
        # (e.g. cp311), which would lock the wheel to one exact Python.
        run: python setup.py bdist_wheel --plat-name=${{ matrix.plat-name }}

      - name: Inspect wheel (Linux only — confirm manylinux tag)
        if: matrix.plat-name == 'manylinux_2_28_x86_64'
        run: |
          pip install auditwheel
          # Don't repair — the binary is statically self-contained and has no
          # Python extension to patch. Just verify the platform tag we set is
          # compatible with the binary's actual dependencies.
          auditwheel show python/dist/*.whl || true

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.plat-name }}
          path: python/dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync sdist version to release tag
        working-directory: python
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" src/docx_extractor/__init__.py

      - name: Install build tooling
        run: pip install --upgrade build

      - name: Build sdist
        working-directory: python
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  publish-pypi:
    name: Publish docx-extractor-cli to PyPI
    needs: [build-wheels, build-sdist, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: List artifacts to publish
        run: ls -la dist/

      - name: Publish to PyPI (OIDC via Trusted Publishing — no token)
        uses: pypa/gh-action-pypi-publish@release/v1
