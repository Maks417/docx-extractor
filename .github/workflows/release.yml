name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: docx-extractor-linux-x86_64

          - os: macos-15-intel  # last GitHub-hosted runner with Intel hardware
            target: x86_64-apple-darwin
            artifact: docx-extractor-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: docx-extractor-macos-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: docx-extractor-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/docx-extractor.exe ${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/docx-extractor ${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-mcp:
    name: Publish docx-extractor-mcp to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to a Trusted-Publishing-aware version
        run: npm install -g npm@latest

      - name: Sync package version to release tag
        working-directory: mcp
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Publishing docx-extractor-mcp@$VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        working-directory: mcp
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: mcp
        run: npm run build

      - name: Publish (OIDC via Trusted Publishing — no token)
        working-directory: mcp
        run: npm publish --access public --provenance
