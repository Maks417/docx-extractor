[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI. The import name stays `docx_extractor`
# (Python module naming convention). `docx-extractor` itself was taken on
# PyPI by an unrelated project, so we use `docx-extractor-cli` — matching
# the existing SKILL.md frontmatter id.
name = "docx-extractor-cli"
# Version is rewritten at release time from the git tag (see
# .github/workflows/release.yml). Keep this in sync with Cargo.toml manually
# for local installs, but the tagged release is the source of truth.
version = "0.4.1"
description = "Extract text, images, footnotes, comments, headers/footers, and tracked changes from .docx files as JSON — wraps the docx-extractor Rust binary."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maks417" }]
keywords = ["docx", "word", "extract", "ooxml", "claude", "mcp"]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/Maks417/docx-extractor"
Source = "https://github.com/Maks417/docx-extractor"
Issues = "https://github.com/Maks417/docx-extractor/issues"

[project.scripts]
docx-extractor = "docx_extractor.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docx_extractor = ["bin/*"]
